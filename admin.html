<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مؤسسة برق سهيل التجارية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{font-family:'Tajawal',sans-serif;background:#0A0F1D;color:#e2e8f0;margin:0}
    h1,h2,h3,h4{font-family:'Cairo',sans-serif}
    ::-webkit-scrollbar{width:5px;height:0px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
    .sidebar{width:230px;min-height:100vh;background:#070C1A;border-left:1px solid #1e293b;position:fixed;top:0;right:0;z-index:40;display:flex;flex-direction:column}
    .main-content{margin-right:230px;min-height:100vh}
    .glass{background:rgba(15,23,42,0.95);border:1px solid #1e293b;border-radius:14px}
    .inp{background:#070c1a;border:1px solid #1e293b;border-radius:9px;padding:9px 13px;color:#e2e8f0;width:100%;font-family:'Tajawal',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
    .inp:focus{border-color:#06b6d4}
    .inp::placeholder{color:#334155}
    .btn-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;transition:opacity .2s}
    .btn-cyan:hover{opacity:.85}
    .btn-ghost{background:#1e293b;color:#94a3b8;border:none;border-radius:10px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;transition:background .2s}
    .btn-ghost:hover{background:#334155;color:#fff}
    .btn-red{background:rgba(239,68,68,.12);color:#f87171;border:none;border-radius:10px;cursor:pointer;transition:background .2s}
    .btn-red:hover{background:rgba(239,68,68,.25)}
    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
    .modal{background:#0f172a;border:1px solid #1e293b;border-radius:18px;width:100%;max-width:820px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .img-drop{border:2px dashed #1e293b;border-radius:10px;min-height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .2s;overflow:hidden}
    .img-drop:hover,.img-drop.over{border-color:#06b6d4;background:rgba(6,182,212,.04)}
    .img-drop img{width:100%;height:130px;object-fit:cover}
    .spec-tag{background:#1e293b;border:1px solid #334155;border-radius:7px;padding:5px 10px;font-size:11px;display:inline-flex;align-items:center;gap:5px}
    .cat-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
    .cdev{background:#1e3a5f;color:#60a5fa}.cthu{background:#1a2e4a;color:#38bdf8}
    .cgar{background:#1e3a2f;color:#4ade80}.cacc{background:#2d2a1e;color:#fbbf24}
    .ccar{background:#2d1e3a;color:#c084fc}.csrv{background:#1e2d2d;color:#2dd4bf}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#06b6d4;color:#fff;font-weight:700;padding:10px 22px;border-radius:40px;z-index:9999;display:none;font-size:13px;white-space:nowrap;box-shadow:0 8px 24px rgba(6,182,212,.3)}
    .row{display:grid;grid-template-columns:52px 1fr 130px 80px 70px 70px 100px;gap:10px;padding:10px 14px;align-items:center;border-bottom:1px solid rgba(30,41,59,.6);transition:background .15s}
    .row:hover{background:rgba(6,182,212,.04)}
    .thead{display:grid;grid-template-columns:52px 1fr 130px 80px 70px 70px 100px;gap:10px;padding:8px 14px;border-bottom:1px solid #1e293b;font-size:10px;color:#475569;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .nav-a{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;color:#64748b;transition:all .2s;cursor:pointer}
    .nav-a:hover{color:#fff;background:rgba(255,255,255,.05)}
    .nav-a.on{color:#22d3ee;background:rgba(34,211,238,.1)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .modal{animation:fadeUp .22s ease}
  </style>
</head>
<body>
<div id="toast"></div>
<input type="file" id="img-inp" accept="image/*" style="display:none" onchange="imgFileChosen(event)">

<aside class="sidebar">
  <div style="padding:18px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:10px;background:rgba(6,182,212,.15);display:flex;align-items:center;justify-content:center;color:#22d3ee"><i class="fas fa-bolt"></i></div>
    <div><div style="color:#fff;font-weight:700;font-size:13px">برق سهيل</div><div style="color:#475569;font-size:11px">لوحة التحكم</div></div>
  </div>
  <nav style="padding:10px;flex:1;display:flex;flex-direction:column;gap:3px;margin-top:6px">
    <a class="nav-a on" id="nav-list" onclick="goSection('list')"><i class="fas fa-boxes-stacked" style="width:15px;text-align:center"></i> إدارة المنتجات</a>
    <a class="nav-a" id="nav-add" onclick="goSection('add')"><i class="fas fa-plus-circle" style="width:15px;text-align:center"></i> إضافة منتج</a>
    <a class="nav-a" id="nav-stats" onclick="goSection('stats')"><i class="fas fa-chart-bar" style="width:15px;text-align:center"></i> الإحصائيات</a>
    <div style="border-top:1px solid #1e293b;margin:6px 0"></div>
    <a class="nav-a" href="index.html"><i class="fas fa-store" style="width:15px;text-align:center"></i> عرض الموقع</a>
  </nav>
  <div style="padding:12px;border-top:1px solid #1e293b;font-size:10px;color:#1e293b;text-align:center">برق سهيل © 2026</div>
</aside>

<div class="main-content">
  <header style="position:sticky;top:0;z-index:30;background:rgba(7,12,26,.97);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:11px 22px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="color:#fff;font-weight:700;font-size:16px">لوحة إدارة المنتجات</span>
      <span id="hbadge" style="background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.2);font-size:11px;font-family:monospace;font-weight:700;padding:3px 10px;border-radius:999px">0 منتج</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-ghost" onclick="exportJSON()" style="padding:7px 14px;font-size:12px"><i class="fas fa-download"></i> تصدير</button>
      <button class="btn-cyan" onclick="goSection('add')" style="padding:7px 14px;font-size:12px"><i class="fas fa-plus"></i> منتج جديد</button>
    </div>
  </header>

  <div style="padding:20px">

    <!-- LIST -->
    <div id="sec-list">
      <div class="glass" style="padding:14px;margin-bottom:16px">
        <div style="display:grid;grid-template-columns:1fr 180px 180px;gap:10px">
          <div style="position:relative">
            <i class="fas fa-search" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#334155;font-size:11px"></i>
            <input class="inp" id="srch" oninput="draw()" placeholder="ابحث بالاسم أو SKU..." style="padding-right:32px">
          </div>
          <select class="inp" id="fcat" onchange="draw()">
            <option value="">كل الفئات</option>
            <option value="devices">📡 أجهزة اللاسلكي</option>
            <option value="thuraya">🛰️ أجهزة الثريا</option>
            <option value="garmin">🗺️ قارمن والملاحة</option>
            <option value="accessories">🔌 الملحقات</option>
            <option value="cards">📶 الشرائح</option>
            <option value="services">🛠️ الخدمات</option>
          </select>
          <select class="inp" id="fsort" onchange="draw()">
            <option value="def">الافتراضي (أجهزة أولاً)</option>
            <option value="name">الاسم أ→ي</option>
            <option value="pa">السعر ↑</option>
            <option value="pd">السعر ↓</option>
            <option value="sa">المخزون ↑</option>
            <option value="sd">المخزون ↓</option>
          </select>
        </div>
        <div style="margin-top:8px;font-size:11px;color:#334155"><span id="rcnt" style="color:#22d3ee;font-family:monospace;font-weight:700"></span></div>
      </div>
      <div class="glass" style="overflow:hidden">
        <div class="thead"><div>صورة</div><div>المنتج</div><div>الفئة</div><div style="text-align:center">السعر</div><div style="text-align:center">خصم</div><div style="text-align:center">مخزون</div><div style="text-align:center">إجراءات</div></div>
        <div id="plist"></div>
      </div>
    </div>

    <!-- ADD -->
    <div id="sec-add" style="display:none;max-width:720px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <button onclick="goSection('list')" style="background:none;border:none;color:#475569;cursor:pointer;font-size:15px"><i class="fas fa-arrow-right"></i></button>
        <h2 style="color:#fff;font-size:17px;margin:0">➕ إضافة منتج جديد</h2>
      </div>
      <div id="add-form-wrap"></div>
    </div>

    <!-- STATS -->
    <div id="sec-stats" style="display:none">
      <h2 style="color:#fff;margin:0 0 18px;font-size:17px">📊 إحصائيات المخزون</h2>
      <div id="stats-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px"></div>
      <div class="glass" style="padding:18px">
        <h3 style="color:#fff;font-size:13px;margin:0 0 14px">⚠️ منتجات نفد مخزونها</h3>
        <div id="zero-list"></div>
      </div>
    </div>

  </div>
</div>

<!-- EDIT OVERLAY -->
<div id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal-body"></div>
</div>

<script src="assets/js/data.js"></script>
<script>
// ── globals ──────────────────────────────────────────────
var P = [];          // all products
var editId = null;
var imgTarget = null;
var addSpecs = [];
var editSpecs = [];

var CATS = {
  devices:    {l:'أجهزة اللاسلكي', e:'📡', c:'cdev'},
  thuraya:    {l:'أجهزة الثريا',   e:'🛰️', c:'cthu'},
  garmin:     {l:'قارمن والملاحة', e:'🗺️', c:'cgar'},
  accessories:{l:'الملحقات',       e:'🔌', c:'cacc'},
  cards:      {l:'الشرائح والرصيد',e:'📶', c:'ccar'},
  services:   {l:'الخدمات',        e:'🛠️', c:'csrv'},
};
var CORD = {devices:1,thuraya:2,garmin:3,accessories:4,cards:5,services:6};

// ── init ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function(){
  // try localStorage first, then fall back to data.js exports
  var ls = localStorage.getItem('barq_products');
  if(ls){ try{ P = JSON.parse(ls); }catch(e){} }

  // if localStorage empty, load from data.js variable
  if(!P || P.length === 0){
    if(typeof INITIAL_PRODUCTS !== 'undefined' && INITIAL_PRODUCTS.length){
      P = INITIAL_PRODUCTS.slice();
    } else if(typeof INVENTORY_PRODUCTS !== 'undefined' && INVENTORY_PRODUCTS.length){
      // Sort by category order
      var ord = {devices:1,thuraya:2,garmin:3,accessories:4,cards:5,services:6};
      P = INVENTORY_PRODUCTS.slice().sort(function(a,b){
        return (ord[a.category]||9)-(ord[b.category]||9);
      }).map(function(p,i){ return Object.assign({},p,{displayIndex:i+1}); });
    }
  }

  // persist to localStorage so admin can edit
  save();
  draw();
  drawStats();
  badge();
});

// ── persist ───────────────────────────────────────────────
function save(){
  localStorage.setItem('barq_products', JSON.stringify(P));
  badge();
}

function badge(){
  var el = document.getElementById('hbadge');
  if(el) el.textContent = P.length + ' منتج';
}

// ── nav ───────────────────────────────────────────────────
function goSection(name){
  ['list','add','stats'].forEach(function(s){
    document.getElementById('sec-'+s).style.display = (s===name)?'block':'none';
    var n = document.getElementById('nav-'+s);
    if(n){ n.classList.toggle('on', s===name); }
  });
  if(name==='add') buildAddForm();
  if(name==='stats') drawStats();
}

// ── draw product list ─────────────────────────────────────
function draw(){
  var q = (document.getElementById('srch').value||'').toLowerCase().trim();
  var fc = document.getElementById('fcat').value||'';
  var fs = document.getElementById('fsort').value||'def';

  var list = P.slice();
  if(fc) list = list.filter(function(p){ return p.category===fc; });
  if(q)  list = list.filter(function(p){
    return (p.name||'').toLowerCase().includes(q)||
           (p.id||'').toLowerCase().includes(q)||
           (p.nameEn||'').toLowerCase().includes(q);
  });

  if(fs==='name') list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ar'); });
  else if(fs==='pa') list.sort(function(a,b){ return (a.price||0)-(b.price||0); });
  else if(fs==='pd') list.sort(function(a,b){ return (b.price||0)-(a.price||0); });
  else if(fs==='sa') list.sort(function(a,b){ return (a.stock||0)-(b.stock||0); });
  else if(fs==='sd') list.sort(function(a,b){ return (b.stock||0)-(a.stock||0); });
  else list.sort(function(a,b){ return (CORD[a.category]||9)-(CORD[b.category]||9)||(a.displayIndex||0)-(b.displayIndex||0); });

  document.getElementById('rcnt').textContent = list.length + ' نتيجة';

  var wrap = document.getElementById('plist');
  if(!list.length){
    wrap.innerHTML = '<div style="padding:50px;text-align:center;color:#334155"><i class="fas fa-box-open" style="font-size:30px;display:block;margin-bottom:10px;opacity:.4"></i>لا توجد منتجات</div>';
    return;
  }

  wrap.innerHTML = list.map(function(p){
    var cat = CATS[p.category]||{l:p.category,e:'📦',c:''};
    var stock = p.stock||0;
    var sc = stock===0?'#f87171':stock<=3?'#fbbf24':'#4ade80';
    var disc = (p.oldPrice&&p.oldPrice>p.price)?Math.round((1-p.price/p.oldPrice)*100):0;
    return '<div class="row">' +
      '<div><div style="width:44px;height:44px;border-radius:8px;overflow:hidden;background:#1e293b;border:1px solid #0f172a;display:flex;align-items:center;justify-content:center">' +
        (p.image
          ? '<img src="'+p.image+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<i class=\"fas fa-image\" style=\"color:#334155;font-size:14px\"></i>'">'
          : '<i class="fas fa-image" style="color:#334155;font-size:14px"></i>') +
      '</div></div>' +
      '<div><div style="color:#e2e8f0;font-size:12px;font-weight:700;line-height:1.35;margin-bottom:3px">'+p.name+'</div>' +
        '<div style="color:#334155;font-size:10px;font-family:monospace">'+p.id+'</div>' +
        (p.badge?'<span style="font-size:9px;background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.15);padding:1px 7px;border-radius:20px;font-weight:700;display:inline-block;margin-top:2px">'+p.badge+'</span>':'') +
      '</div>' +
      '<div><span class="cat-badge '+cat.c+'">'+cat.e+' '+cat.l+'</span></div>' +
      '<div style="text-align:center"><span style="color:#22d3ee;font-size:13px;font-weight:700;font-family:monospace">'+(p.price||0).toLocaleString()+'</span><div style="color:#334155;font-size:9px">ر.س</div></div>' +
      '<div style="text-align:center">'+(disc>0?'<span style="font-size:10px;font-weight:700;color:#4ade80;background:rgba(74,222,128,.1);padding:2px 7px;border-radius:999px">'+disc+'%</span>':'<span style="color:#1e293b">—</span>')+'</div>' +
      '<div style="text-align:center"><span style="font-size:13px;font-weight:700;font-family:monospace;color:'+sc+'">'+( stock===999?'∞':stock )+'</span></div>' +
      '<div style="display:flex;gap:5px;justify-content:center">' +
        '<button onclick="openEdit(''+p.id+'')" style="width:30px;height:30px;border-radius:7px;background:rgba(34,211,238,.1);color:#22d3ee;border:none;cursor:pointer;font-size:12px" title="تعديل"><i class="fas fa-pen"></i></button>' +
        '<button onclick="dupe(''+p.id+'')" style="width:30px;height:30px;border-radius:7px;background:rgba(100,116,139,.15);color:#94a3b8;border:none;cursor:pointer;font-size:12px" title="نسخ"><i class="fas fa-copy"></i></button>' +
        '<button onclick="del(''+p.id+'')" style="width:30px;height:30px;border-radius:7px;background:rgba(239,68,68,.1);color:#f87171;border:none;cursor:pointer;font-size:12px" title="حذف"><i class="fas fa-trash"></i></button>' +
      '</div></div>';
  }).join('');
}

// ── EDIT ─────────────────────────────────────────────────
function openEdit(id){
  var p = P.find(function(x){ return x.id===id; });
  if(!p) return;
  editId = id;
  editSpecs = (p.specs||[]).slice();
  imgTarget = 'edit';

  document.getElementById('modal-body').innerHTML = buildForm(p, false);
  document.getElementById('overlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';

  // listeners
  setTimeout(function(){
    var pe = document.getElementById('f-price');
    var oe = document.getElementById('f-oldprice');
    if(pe) pe.addEventListener('input', calcDisc);
    if(oe) oe.addEventListener('input', calcDisc);
    calcDisc();
    stockColor();
    renderEditSpecs();
  }, 30);
}

function closeModal(){
  document.getElementById('overlay').style.display = 'none';
  document.body.style.overflow = '';
}

function overlayClick(e){
  if(e.target===document.getElementById('overlay')) closeModal();
}

function buildForm(p, isAdd){
  var catOpts = Object.entries(CATS).map(function(en){
    var val=en[0],m=en[1];
    var sel = (!isAdd && p && p.category===val)?' selected':'';
    return '<option value="'+val+'"'+sel+'>'+m.e+' '+m.l+'</option>';
  }).join('');

  var imgHtml = (p && p.image)
    ? '<img src="'+p.image+'" style="width:100%;height:130px;object-fit:cover">'
    : '<div style="text-align:center;color:#334155"><i class="fas fa-cloud-upload-alt" style="font-size:26px;display:block;margin-bottom:6px;color:#1e293b"></i><div style="font-size:11px">اضغط أو اسحب صورة</div></div>';

  var imgVal = (p && p.image)||'';
  var name   = (p && p.name)||'';
  var nameEn = (p && p.nameEn)||'';
  var badge  = (p && p.badge)||'';
  var price  = (p && p.price)||0;
  var old    = (p && p.oldPrice)||'';
  var stock  = (p && p.stock)||0;
  var rating = (p && p.rating)||4.5;
  var revs   = (p && p.reviewsCount)||0;
  var desc   = (p && p.shortDesc)||'';
  var ttl    = isAdd ? '➕ إضافة منتج جديد' : '✏️ تعديل: '+name;
  var saveLbl= isAdd ? 'إضافة المنتج' : 'حفظ التعديلات';
  var saveAct= isAdd ? 'doAdd()' : 'doSave()';

  return '<div style="padding:22px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #1e293b">'+
    '<h2 style="color:#fff;font-size:15px;margin:0">'+ttl+'</h2>'+
    '<button onclick="closeModal()" style="width:32px;height:32px;border-radius:8px;background:#1e293b;border:none;color:#64748b;cursor:pointer;font-size:13px"><i class="fas fa-times"></i></button>'+
    '</div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">'+

    // LEFT
    '<div style="display:flex;flex-direction:column;gap:13px">'+
    '<div><label style="display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:6px">📷 صورة المنتج</label>'+
    '<div class="img-drop" id="f-imgzone" onclick="trigImg('edit')" ondragover="ev.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropImg(event,'edit')">'+imgHtml+'</div>'+
    '<input class="inp" id="f-imgurl" style="margin-top:7px;font-size:11px" placeholder="أو الصق رابط الصورة..." value="'+imgVal+'" oninput="prevImg('edit')"></div>'+

    '<div><label style="display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:6px">📌 اسم المنتج</label>'+
    '<input class="inp" id="f-name" value="'+name+'" placeholder="اسم المنتج بالعربي"></div>'+

    '<div><label style="display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:6px">🔤 الاسم بالإنجليزي</label>'+
    '<input class="inp" id="f-nameen" value="'+nameEn+'" placeholder="English Name"></div>'+

    '<div><label style="display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:6px">🗂️ الفئة</label>'+

    '<div><label style="display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:6px">📦 كمية المخزون</label>'+
    '<div style="display:flex;gap:7px;align-items:center">'+
    '<button type="button" onclick="adjStock(-1)" style="width:36px;height:36px;flex-shrink:0;border-radius:8px;background:#1e293b;border:none;color:#fff;cursor:pointer;font-size:18px;font-weight:700">−</button>'+
    '<input type="number" class="inp" id="f-stock" value="'+stock+'" min="0" oninput="stockColor()" style="text-align:center;font-family:monospace;font-weight:700;font-size:17px;color:#4ade80">'+
    '<button type="button" onclick="adjStock(1)" style="width:36px;height:36px;flex-shrink:0;border-radius:8px;background:#1e293b;border:none;color:#fff;cursor:pointer;font-size:18px;font-weight:700">+</button>'+
    '</div>'+
    '<div style="display:flex;gap:6px;margin-top:7px">'+
    '<button type="button" onclick="setStock(0)" style="flex:1;font-size:10px;background:rgba(239,68,68,.1);color:#f87171;border:none;padding:5px;border-radius:7px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700">نفذ</button>'+
    '<button type="button" onclick="setStock(5)" style="flex:1;font-size:10px;background:#1e293b;color:#64748b;border:none;padding:5px;border-radius:7px;cursor:pointer;font-family:'Tajawal',sans-serif">5</button>'+
    '<button type="button" onclick="setStock(10)" style="flex:1;font-size:10px;background:#1e293b;color:#64748b;border:none;padding:5px;border-radius:7px;cursor:pointer;font-family:'Tajawal',sans-serif">10</button>'+

    '<div style="display:flex;gap:7px">'+
    '<input class="inp" id="f-newspec" style="flex:1" placeholder="اكتب مواصفة واضغط Enter أو +" onkeydown="if(event.key==='Enter'){event.preventDefault();addSpec();}">'+
    '<button type="button" onclick="addSpec()" style="width:36px;height:36px;flex-shrink:0;border-radius:8px;background:rgba(34,211,238,.15);color:#22d3ee;border:none;cursor:pointer;font-size:14px"><i class="fas fa-plus"></i></button>'+
    '</div></div>'+

    // ACTIONS
    '<div style="display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid #1e293b">'+

    '<button class="btn-ghost" onclick="closeModal()" style="padding:12px 18px;font-size:13px">إلغاء</button>'+
    (isAdd?'':'<button class="btn-red" onclick="del(''+( p?p.id:'' )+'',true)" style="width:40px;height:auto;padding:12px;border-radius:10px"><i class="fas fa-trash" style="font-size:12px"></i></button>')+
    '</div></div>';
}

function renderEditSpecs(){
  var c = document.getElementById('f-specs');
  if(!c) return;
  if(!editSpecs.length){ c.innerHTML='<span style="color:#1e293b;font-size:11px">لا توجد مواصفات بعد...</span>'; return; }
  c.innerHTML = editSpecs.map(function(s,i){
    return '<span class="spec-tag">'+s+'<button type="button" onclick="rmSpec('+i+')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:10px;padding:0 0 0 4px"><i class="fas fa-times"></i></button></span>';
  }).join('');
}

function addSpec(){
  var inp = document.getElementById('f-newspec');
  var v = (inp&&inp.value||'').trim();
  if(!v) return;
  editSpecs.push(v);
  inp.value = '';
  renderEditSpecs();
}

function rmSpec(i){ editSpecs.splice(i,1); renderEditSpecs(); }

function calcDisc(){
  var pr = parseFloat((document.getElementById('f-price')||{value:0}).value)||0;
  var op = parseFloat((document.getElementById('f-oldprice')||{value:0}).value)||0;
  var box= document.getElementById('disc-box');
  var pct= document.getElementById('disc-pct');
  if(op>pr&&op>0&&pr>0&&box&&pct){
    pct.textContent = Math.round((1-pr/op)*100)+'%';
    box.style.display='block';
  } else if(box) box.style.display='none';
}

function adjStock(d){
  var inp=document.getElementById('f-stock');
  if(!inp) return;
  inp.value=Math.max(0,(parseInt(inp.value)||0)+d);
  stockColor();
}

function setStock(v){
  var inp=document.getElementById('f-stock');
  if(!inp) return;
  inp.value=v; stockColor();
}

function stockColor(){
  var inp=document.getElementById('f-stock');
  if(!inp) return;
  var v=parseInt(inp.value)||0;
  inp.style.color=v===0?'#f87171':v<=3?'#fbbf24':'#4ade80';
}

// ── images ────────────────────────────────────────────────
function trigImg(tgt){ imgTarget=tgt; document.getElementById('img-inp').click(); }

function imgFileChosen(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){ applyImg(imgTarget, ev.target.result); };
  r.readAsDataURL(f);
  e.target.value='';
}

function dropImg(e,tgt){
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  var f=e.dataTransfer&&e.dataTransfer.files[0];
  if(!f||!f.type.startsWith('image/')) return;
  imgTarget=tgt;
  var r=new FileReader();
  r.onload=function(ev){ applyImg(tgt, ev.target.result); };
  r.readAsDataURL(f);
}

function applyImg(tgt, src){
  var zone=document.getElementById('f-imgzone');
  var url =document.getElementById('f-imgurl');
  if(zone) zone.innerHTML='<img src="'+src+'" style="width:100%;height:130px;object-fit:cover">';
  if(url)  url.value=src;
}

function prevImg(tgt){
  var url=document.getElementById('f-imgurl');
  var zone=document.getElementById('f-imgzone');
  if(!url||!zone) return;
  var v=url.value.trim();
  if(v) zone.innerHTML='<img src="'+v+'" style="width:100%;height:130px;object-fit:cover" onerror="this.parentElement.innerHTML='<div style=\"color:#f87171;font-size:11px;text-align:center\">رابط خاطئ</div>'">';
}

// ── save edit ────────────────────────────────────────────
function doSave(){
  var idx = P.findIndex(function(p){ return p.id===editId; });
  if(idx===-1){ toast('خطأ!'); return; }
  var cat = document.getElementById('f-cat').value||'accessories';
  P[idx] = Object.assign({}, P[idx], {
    name:    (document.getElementById('f-name').value||'').trim(),
    nameEn:  (document.getElementById('f-nameen').value||'').trim(),
    category: cat,
    categoryName: (CATS[cat]||{l:cat}).l,
    badge:   (document.getElementById('f-badge').value||'').trim(),
    price:   parseFloat(document.getElementById('f-price').value)||0,
    oldPrice:(function(){
      var op=parseFloat(document.getElementById('f-oldprice').value)||0;
      var pr=parseFloat(document.getElementById('f-price').value)||0;
      return op>pr?op:0;
    })(),
    stock:   parseInt(document.getElementById('f-stock').value)||0,
    rating:  parseFloat(document.getElementById('f-rating').value)||4.5,
    reviewsCount: parseInt(document.getElementById('f-revs').value)||0,
    shortDesc: (document.getElementById('f-desc').value||'').trim(),
    specs:   editSpecs.slice(),
    image:   (document.getElementById('f-imgurl').value||'').trim() || P[idx].image || ''
  });
  save(); closeModal(); draw();
  toast('✅ تم حفظ "'+P[idx].name+'"!');
}

// ── add ───────────────────────────────────────────────────
function buildAddForm(){
  editSpecs=[]; imgTarget='edit';
  document.getElementById('add-form-wrap').innerHTML =
    '<div class="glass">'+buildForm(null, true)+'</div>';
  setTimeout(function(){
    var pe=document.getElementById('f-price');
    var oe=document.getElementById('f-oldprice');
    if(pe) pe.addEventListener('input',calcDisc);
    if(oe) oe.addEventListener('input',calcDisc);
    renderEditSpecs();
  },30);
}

function doAdd(){
  var name=(document.getElementById('f-name').value||'').trim();
  if(!name){ toast('❌ أدخل اسم المنتج!'); return; }
  var price=parseFloat(document.getElementById('f-price').value)||0;
  if(!price){ toast('❌ أدخل السعر!'); return; }
  var cat=document.getElementById('f-cat').value||'accessories';
  var op=parseFloat(document.getElementById('f-oldprice').value)||0;
  P.push({
    id:'NEW-'+Date.now().toString(36).toUpperCase(),
    name:name,
    nameEn:(document.getElementById('f-nameen').value||'').trim(),
    category:cat,
    categoryName:(CATS[cat]||{l:cat}).l,
    badge:(document.getElementById('f-badge').value||'').trim(),
    price:price,
    oldPrice:op>price?op:0,
    stock:parseInt(document.getElementById('f-stock').value)||0,
    rating:parseFloat(document.getElementById('f-rating').value)||4.5,
    reviewsCount:parseInt(document.getElementById('f-revs').value)||0,
    shortDesc:(document.getElementById('f-desc').value||'').trim(),
    specs:editSpecs.slice(),
    image:(document.getElementById('f-imgurl').value||'').trim(),
    displayIndex:P.length+1
  });
  save(); goSection('list'); draw();
  toast('✅ تم إضافة "'+name+'"!');
}

// ── delete / dupe ─────────────────────────────────────────
function del(id, fromModal){
  var p=P.find(function(x){return x.id===id;});
  if(!p) return;
  if(!confirm('حذف "'+p.name+'"؟')) return;
  P=P.filter(function(x){return x.id!==id;});
  save(); if(fromModal) closeModal(); draw();
  toast('🗑️ تم حذف "'+p.name+'"');
}

function dupe(id){
  var p=P.find(function(x){return x.id===id;});
  if(!p) return;
  var c=Object.assign({},p,{id:'CPY-'+Date.now().toString(36).toUpperCase(),name:'نسخة - '+p.name});
  var i=P.findIndex(function(x){return x.id===id;});
  P.splice(i+1,0,c);
  save(); draw();
  toast('📋 تم نسخ "'+p.name+'"');
}

// ── stats ─────────────────────────────────────────────────
function drawStats(){
  var sc={}; var tot=0; var zero=[];
  P.forEach(function(p){
    sc[p.category]=(sc[p.category]||0)+1;
    tot+=(p.stock||0);
    if((p.stock||0)<=0) zero.push(p);
  });
  var st=[
    {l:'إجمالي المنتجات',v:P.length,i:'fas fa-boxes-stacked',c:'#22d3ee',bg:'rgba(34,211,238,.1)'},
    {l:'إجمالي المخزون',v:tot,i:'fas fa-warehouse',c:'#4ade80',bg:'rgba(74,222,128,.1)'},
    {l:'نفد المخزون',v:zero.length,i:'fas fa-triangle-exclamation',c:'#f87171',bg:'rgba(239,68,68,.1)'},
    {l:'أجهزة اللاسلكي',v:sc.devices||0,i:'fas fa-radio',c:'#60a5fa',bg:'rgba(96,165,250,.1)'},
    {l:'أجهزة الثريا',v:sc.thuraya||0,i:'fas fa-satellite',c:'#38bdf8',bg:'rgba(56,189,248,.1)'},
    {l:'قارمن وملاحة',v:sc.garmin||0,i:'fas fa-map-location-dot',c:'#4ade80',bg:'rgba(74,222,128,.1)'},
    {l:'ملحقات وهوائيات',v:sc.accessories||0,i:'fas fa-plug',c:'#fbbf24',bg:'rgba(251,191,36,.1)'},
    {l:'شرائح وخدمات',v:(sc.cards||0)+(sc.services||0),i:'fas fa-sim-card',c:'#c084fc',bg:'rgba(192,132,252,.1)'},
  ];
  var sg=document.getElementById('stats-cards');
  if(sg) sg.innerHTML=st.map(function(s){
    return '<div class="glass" style="padding:14px 16px;display:flex;align-items:center;gap:12px">'+
    '<div style="width:42px;height:42px;border-radius:10px;background:'+s.bg+';color:'+s.c+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0"><i class="'+s.i+'"></i></div>'+
    '<div><div style="font-size:22px;font-weight:900;font-family:monospace;color:'+s.c+'">'+s.v+'</div>'+
    '<div style="font-size:11px;color:#475569">'+s.l+'</div></div></div>';
  }).join('');
  var zl=document.getElementById('zero-list');
  if(zl){
    if(!zero.length){ zl.innerHTML='<div style="color:#4ade80;font-size:12px;padding:14px;text-align:center"><i class="fas fa-check-circle"></i> كل المنتجات لديها مخزون ✓</div>'; }
    else zl.innerHTML=zero.map(function(p){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);border-radius:9px;margin-bottom:8px">'+
      '<div><div style="color:#e2e8f0;font-size:12px;font-weight:700">'+p.name+'</div><div style="color:#334155;font-size:10px;font-family:monospace">'+p.id+'</div></div>'+
      '<button onclick="openEdit(''+p.id+'')" style="font-size:10px;background:rgba(34,211,238,.1);color:#22d3ee;border:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif">تعديل</button>'+
      '</div>';
    }).join('');
  }
}

// ── export ────────────────────────────────────────────────
function exportJSON(){
  var b=new Blob([JSON.stringify(P,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u; a.download='barq-products-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(u);
  toast('📥 تم التصدير!');
}

// ── toast ─────────────────────────────────────────────────
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.style.display='none';},3000);
}
</script>
