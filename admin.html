<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مؤسسة برق سهيل التجارية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{teal:'#008DA5',cyan:'#00D2FF',dark:'#0A0F1D'}},fontFamily:{cairo:['Cairo','sans-serif'],tajawal:['Tajawal','sans-serif']}}}}</script>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Tajawal',sans-serif;background:#0A0F1D;color:#e2e8f0;margin:0}
    h1,h2,h3,h4{font-family:'Cairo',sans-serif}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#00D2FF44;border-radius:3px}
    .sidebar{width:240px;min-height:100vh;background:#070C1A;border-left:1px solid #1e293b;position:fixed;top:0;right:0;z-index:40;display:flex;flex-direction:column}
    .main-content{margin-right:240px;min-height:100vh}
    .glass-card{background:rgba(15,23,42,0.9);border:1px solid #1e293b;border-radius:16px}
    #edit-panel{position:fixed;top:0;left:0;width:calc(100% - 240px);height:100vh;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
    .edit-modal{background:#0f172a;border:1px solid #1e293b;border-radius:20px;width:100%;max-width:800px;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,210,255,0.1)}
    .img-upload-zone{border:2px dashed #1e293b;border-radius:12px;cursor:pointer;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:all 0.2s;overflow:hidden}
    .img-upload-zone:hover,.img-upload-zone.drag-over{border-color:#00D2FF;background:rgba(0,210,255,0.05)}
    .img-upload-zone img{width:100%;height:140px;object-fit:cover}
    .admin-input{background:#0a0f1d;border:1px solid #1e293b;border-radius:10px;padding:10px 14px;color:#e2e8f0;width:100%;font-family:'Tajawal',sans-serif;font-size:14px;transition:border-color 0.2s;outline:none}
    .admin-input:focus{border-color:#00D2FF}
    .admin-input::placeholder{color:#475569}
    .spec-tag{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
    .badge-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .stock-high{color:#34d399}
    .stock-low{color:#fbbf24}
    .stock-zero{color:#f87171}
    .cat-devices{background:#1e3a5f;color:#60a5fa}
    .cat-thuraya{background:#1a2e4a;color:#38bdf8}
    .cat-garmin{background:#1e3a2f;color:#34d399}
    .cat-accessories{background:#2d2a1e;color:#fbbf24}
    .cat-cards{background:#2d1e3a;color:#c084fc}
    .cat-services{background:#1e2d2d;color:#2dd4bf}
    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#00D2FF;color:#0a0f1d;font-weight:700;padding:12px 24px;border-radius:50px;z-index:9999;display:none;font-size:14px;box-shadow:0 8px 30px rgba(0,210,255,0.3);white-space:nowrap}
    .stat-card{background:linear-gradient(135deg,#0f172a,#111827);border:1px solid #1e293b;border-radius:14px;padding:16px 20px}
    @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .edit-modal{animation:slideIn 0.25s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    #edit-panel{animation:fadeIn 0.2s ease}
    .nav-link{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;transition:all 0.2s;color:#94a3b8}
    .nav-link:hover{color:#ffffff;background:rgba(255,255,255,0.05)}
    .nav-link.active{color:#22d3ee;background:rgba(34,211,238,0.1)}
    .prod-row{display:grid;grid-template-columns:56px 1fr 140px 80px 70px 70px 100px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(30,41,59,0.5);transition:background 0.15s}
    .prod-row:hover{background:rgba(15,23,42,0.6)}
    .prod-row:last-child{border-bottom:none}
    .tbl-head{display:grid;grid-template-columns:56px 1fr 140px 80px 70px 70px 100px;gap:12px;padding:10px 16px;border-bottom:1px solid #1e293b;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em}
  </style>
</head>
<body>

<div id="toast"></div>
<input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">

<!-- Sidebar -->
<aside class="sidebar">
  <div style="padding:20px;border-bottom:1px solid #1e293b">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(34,211,238,0.15);display:flex;align-items:center;justify-content:center;color:#22d3ee;font-size:18px"><i class="fas fa-bolt"></i></div>
      <div>
        <div style="color:#fff;font-weight:700;font-size:14px">برق سهيل</div>
        <div style="color:#64748b;font-size:11px">لوحة التحكم</div>
      </div>
    </div>
  </div>
  <nav style="padding:12px;flex:1;margin-top:8px;display:flex;flex-direction:column;gap:4px">
    <a href="#" onclick="showSection('products');return false" id="nav-products" class="nav-link active"><i class="fas fa-boxes-stacked" style="width:16px;text-align:center"></i> إدارة المنتجات</a>
    <a href="#" onclick="showSection('add');return false" id="nav-add" class="nav-link"><i class="fas fa-plus-circle" style="width:16px;text-align:center"></i> إضافة منتج</a>
    <a href="#" onclick="showSection('stats');return false" id="nav-stats" class="nav-link"><i class="fas fa-chart-bar" style="width:16px;text-align:center"></i> إحصائيات</a>
    <div style="border-top:1px solid #1e293b;margin:8px 0"></div>
    <a href="index.html" class="nav-link"><i class="fas fa-store" style="width:16px;text-align:center"></i> عرض الموقع</a>
  </nav>
  <div style="padding:16px;border-top:1px solid #1e293b;font-size:11px;color:#334155;text-align:center">برق سهيل © 2026</div>
</aside>

<!-- Main -->
<div class="main-content">
  <header style="position:sticky;top:0;z-index:30;background:rgba(7,12,26,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:12px 24px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px">
      <h1 style="color:#fff;font-size:17px;margin:0">لوحة إدارة المنتجات</h1>
      <span id="total-badge" style="background:rgba(34,211,238,0.1);color:#22d3ee;border:1px solid rgba(34,211,238,0.2);font-size:11px;font-family:monospace;font-weight:700;padding:4px 12px;border-radius:999px">0 منتج</span>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="exportData()" style="display:flex;align-items:center;gap:8px;background:#1e293b;color:#cbd5e1;border:none;cursor:pointer;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;font-family:'Tajawal',sans-serif"><i class="fas fa-download"></i> تصدير</button>
      <button onclick="showSection('add')" style="display:flex;align-items:center;gap:8px;background:linear-gradient(to right,#06b6d4,#14b8a6);color:#0a0f1d;border:none;cursor:pointer;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;font-family:'Tajawal',sans-serif;box-shadow:0 4px 15px rgba(6,182,212,0.2)"><i class="fas fa-plus"></i> منتج جديد</button>
    </div>
  </header>

  <div style="padding:24px">

    <!-- Stats Section -->
    <div id="section-stats" style="display:none">
      <h2 style="color:#fff;font-size:18px;margin:0 0 20px">📊 إحصائيات المخزون</h2>
      <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px"></div>
      <div class="glass-card" style="padding:20px">
        <h3 style="color:#fff;font-size:13px;margin:0 0 16px">⚠️ منتجات نفد مخزونها أو على وشك النفاد</h3>
        <div id="zero-stock-list"></div>
      </div>
    </div>

    <!-- Products Section -->
    <div id="section-products">
      <!-- Filter Bar -->
      <div class="glass-card" style="padding:16px;margin-bottom:20px">
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center">
          <div style="position:relative">
            <i class="fas fa-search" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#475569;font-size:12px"></i>
            <input type="text" id="admin-search" oninput="renderAdminProducts()" placeholder="ابحث بالاسم أو SKU..." class="admin-input" style="padding-right:36px">
          </div>
          <select id="admin-cat-filter" onchange="renderAdminProducts()" class="admin-input">
            <option value="all">كل الفئات</option>
            <option value="devices">📡 أجهزة اللاسلكي</option>
            <option value="thuraya">🛰️ أجهزة الثريا</option>
            <option value="garmin">🗺️ قارمن والملاحة</option>
            <option value="accessories">🔌 الملحقات والهوائيات</option>
            <option value="cards">📶 الشرائح والرصيد</option>
            <option value="services">🛠️ الخدمات</option>
          </select>
          <select id="admin-sort" onchange="renderAdminProducts()" class="admin-input" style="width:auto;min-width:180px">
            <option value="default">الافتراضي</option>
            <option value="name">الاسم أ → ي</option>
            <option value="price-asc">السعر ↑</option>
            <option value="price-desc">السعر ↓</option>
            <option value="stock-asc">المخزون ↑</option>
            <option value="stock-desc">المخزون ↓</option>
          </select>
        </div>
        <div style="margin-top:10px;font-size:12px;color:#64748b">
          <span id="admin-results-count" style="color:#22d3ee;font-family:monospace;font-weight:700"></span>
        </div>
      </div>

      <!-- Table -->
      <div class="glass-card" style="overflow:hidden">
        <div class="tbl-head">
          <div>صورة</div>
          <div>المنتج</div>
          <div>الفئة</div>
          <div style="text-align:center">السعر</div>
          <div style="text-align:center">خصم</div>
          <div style="text-align:center">مخزون</div>
          <div style="text-align:center">إجراءات</div>
        </div>
        <div id="admin-products-list"></div>
      </div>
    </div>

    <!-- Add Section -->
    <div id="section-add" style="display:none;max-width:700px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <button onclick="showSection('products')" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:16px;padding:0"><i class="fas fa-arrow-right"></i></button>
        <h2 style="color:#fff;font-size:18px;margin:0">➕ إضافة منتج جديد</h2>
      </div>
      <div id="add-product-form-container"></div>
    </div>

  </div>
</div>

<!-- Edit Modal -->
<div id="edit-panel" style="display:none" onclick="closeEditIfBackdrop(event)">
  <div class="edit-modal" id="edit-modal-inner"></div>
</div>

<script src="assets/js/data.js"></script>
<script>
var adminProducts=[];
var editingId=null;
var currentImgField=null;
var addFormSpecs=[];

var CAT_META={
  devices:{label:'أجهزة اللاسلكي',icon:'📡',cls:'cat-devices'},
  thuraya:{label:'أجهزة الثريا',icon:'🛰️',cls:'cat-thuraya'},
  garmin:{label:'قارمن والملاحة',icon:'🗺️',cls:'cat-garmin'},
  accessories:{label:'الملحقات والهوائيات',icon:'🔌',cls:'cat-accessories'},
  cards:{label:'الشرائح والرصيد',icon:'📶',cls:'cat-cards'},
  services:{label:'الخدمات',icon:'🛠️',cls:'cat-services'}
};

var CAT_ORDER={devices:1,thuraya:2,garmin:3,accessories:4,cards:5,services:6};

document.addEventListener('DOMContentLoaded',function(){
  loadProducts();
  renderAdminProducts();
  renderStats();
  updateTotalBadge();
});

function loadProducts(){
  var s=localStorage.getItem('barq_products');
  if(s){try{adminProducts=JSON.parse(s);}catch(e){}}
  if(!adminProducts||adminProducts.length===0){
    adminProducts=typeof INITIAL_PRODUCTS!=='undefined'?[...INITIAL_PRODUCTS]:[];
  }
}

function saveProducts(){
  localStorage.setItem('barq_products',JSON.stringify(adminProducts));
  updateTotalBadge();
}

function updateTotalBadge(){
  var el=document.getElementById('total-badge');
  if(el)el.textContent=adminProducts.length+' منتج';
}

function showSection(name){
  ['products','stats','add'].forEach(function(s){
    var el=document.getElementById('section-'+s);
    if(el)el.style.display=(s===name)?'block':'none';
  });
  ['products','stats','add'].forEach(function(s){
    var el=document.getElementById('nav-'+s);
    if(el){el.classList.remove('active');}
  });
  var activeNav=document.getElementById('nav-'+name);
  if(activeNav)activeNav.classList.add('active');
  if(name==='add')renderAddForm();
  if(name==='stats')renderStats();
}

function catOptions(selected){
  return Object.entries(CAT_META).map(function(e){
    var val=e[0],meta=e[1];
    return '<option value="'+val+'"'+(selected===val?' selected':'')+'>'+meta.icon+' '+meta.label+'</option>';
  }).join('');
}

function renderAdminProducts(){
  var search=(document.getElementById('admin-search')||{value:''}).value.toLowerCase().trim();
  var catFilter=(document.getElementById('admin-cat-filter')||{value:'all'}).value;
  var sortVal=(document.getElementById('admin-sort')||{value:'default'}).value;
  var list=adminProducts.slice();
  if(catFilter!=='all')list=list.filter(function(p){return p.category===catFilter;});
  if(search)list=list.filter(function(p){
    return (p.name||'').toLowerCase().includes(search)||
           (p.id||'').toLowerCase().includes(search)||
           (p.nameEn||'').toLowerCase().includes(search);
  });
  if(sortVal==='name')list.sort(function(a,b){return(a.name||'').localeCompare(b.name||'','ar');});
  else if(sortVal==='price-asc')list.sort(function(a,b){return(a.price||0)-(b.price||0);});
  else if(sortVal==='price-desc')list.sort(function(a,b){return(b.price||0)-(a.price||0);});
  else if(sortVal==='stock-asc')list.sort(function(a,b){return(a.stock||0)-(b.stock||0);});
  else if(sortVal==='stock-desc')list.sort(function(a,b){return(b.stock||0)-(a.stock||0);});
  else list.sort(function(a,b){return((CAT_ORDER[a.category]||9)-(CAT_ORDER[b.category]||9))||((a.displayIndex||0)-(b.displayIndex||0));});
  var cEl=document.getElementById('admin-results-count');
  if(cEl)cEl.textContent=list.length+' نتيجة';
  var container=document.getElementById('admin-products-list');
  if(!container)return;
  if(list.length===0){container.innerHTML='<div style="padding:60px;text-align:center;color:#475569"><i class="fas fa-search" style="font-size:32px;margin-bottom:12px;display:block;opacity:0.3"></i>لا توجد منتجات مطابقة</div>';return;}
  container.innerHTML=list.map(function(p){
    var cat=CAT_META[p.category]||{label:p.category,icon:'📦',cls:''};
    var stock=p.stock||0;
    var sClass=stock===0?'stock-zero':stock<=3?'stock-low':'stock-high';
    var disc=p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
    return '<div class="prod-row">'+
      '<div><div style="width:48px;height:48px;border-radius:10px;overflow:hidden;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center">'+
      (p.image?'<img src="'+p.image+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<i class=\"fas fa-image\" style=\"color:#475569;font-size:16px\"></i>'">'
              :'<i class="fas fa-image" style="color:#475569;font-size:16px"></i>')+'</div></div>'+
      '<div><div style="color:#fff;font-size:13px;font-weight:700;line-height:1.3;margin-bottom:3px">'+p.name+'</div>'+
      '<div style="color:#475569;font-size:11px;font-family:monospace">'+p.id+'</div>'+
      (p.badge?'<span style="font-size:10px;background:rgba(34,211,238,0.1);color:#22d3ee;border:1px solid rgba(34,211,238,0.2);padding:2px 8px;border-radius:999px;font-weight:700;display:inline-block;margin-top:3px">'+p.badge+'</span>':'')+'</div>'+
      '<div><span class="badge-pill '+cat.cls+'">'+cat.icon+' '+cat.label+'</span></div>'+
      '<div style="text-align:center"><div style="color:#22d3ee;font-size:14px;font-weight:700;font-family:monospace">'+(p.price||0).toLocaleString()+'</div><div style="color:#475569;font-size:10px">ر.س</div></div>'+
      '<div style="text-align:center">'+(disc>0?'<span style="font-size:11px;font-weight:700;color:#34d399;background:rgba(52,211,153,0.1);padding:3px 8px;border-radius:999px">'+disc+'%</span>':'<span style="color:#334155;font-size:12px">—</span>')+'</div>'+
      '<div style="text-align:center"><div class="'+sClass+'" style="font-size:14px;font-weight:700;font-family:monospace">'+(stock===999?'∞':stock)+'</div></div>'+
      '<div style="display:flex;gap:6px;justify-content:center">'+
      '<button onclick="openEdit(''+p.id+'')" style="width:32px;height:32px;border-radius:8px;background:rgba(34,211,238,0.1);color:#22d3ee;border:none;cursor:pointer;font-size:13px" title="تعديل"><i class="fas fa-pen"></i></button>'+
      '<button onclick="duplicateProduct(''+p.id+'')" style="width:32px;height:32px;border-radius:8px;background:rgba(100,116,139,0.2);color:#94a3b8;border:none;cursor:pointer;font-size:13px" title="نسخ"><i class="fas fa-copy"></i></button>'+
      '<button onclick="deleteProduct(''+p.id+'')" style="width:32px;height:32px;border-radius:8px;background:rgba(239,68,68,0.1);color:#ef4444;border:none;cursor:pointer;font-size:13px" title="حذف"><i class="fas fa-trash"></i></button>'+
      '</div></div>';
  }).join('');
}

function openEdit(id){
  var p=adminProducts.find(function(x){return x.id===id;});
  if(!p)return;
  editingId=id;
  currentImgField='edit';
  window._editSpecs=[...(p.specs||[])];
  var modal=document.getElementById('edit-modal-inner');
  modal.innerHTML=buildEditForm(p);
  document.getElementById('edit-panel').style.display='flex';
  document.body.style.overflow='hidden';
  setTimeout(function(){
    var pe=document.getElementById('edit-price');
    var oe=document.getElementById('edit-oldPrice');
    if(pe)pe.addEventListener('input',updateDiscountPreview);
    if(oe)oe.addEventListener('input',updateDiscountPreview);
    updateDiscountPreview();
    updateStockColor();
    refreshEditSpecs();
  },50);
}

function buildEditForm(p){
  return '<div style="padding:24px">'+
  '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #1e293b">'+
  '<div><h2 style="color:#fff;font-size:16px;margin:0">✏️ تعديل المنتج</h2><p style="color:#475569;font-size:11px;font-family:monospace;margin:4px 0 0">'+p.id+'</p></div>'+
  '<button onclick="closeEdit()" style="width:36px;height:36px;border-radius:10px;background:#1e293b;border:none;color:#94a3b8;cursor:pointer;font-size:14px"><i class="fas fa-times"></i></button></div>'+

  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'+

  '<div style="display:flex;flex-direction:column;gap:16px">'+
  '<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px">📷 صورة المنتج</label>'+
  '<div class="img-upload-zone" id="edit-img-zone" onclick="triggerImageUpload('edit')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleImageDrop(event,'edit')">'+
  (p.image?'<img src="'+p.image+'" style="width:100%;height:140px;object-fit:cover">':
  '<div style="text-align:center;color:#475569"><i class="fas fa-cloud-upload-alt" style="font-size:28px;margin-bottom:8px;display:block;color:#334155"></i><div style="font-size:12px">اضغط أو اسحب صورة</div><div style="font-size:10px;color:#334155;margin-top:4px">JPG, PNG, WEBP</div></div>')+
  '</div>'+
  '<input type="text" id="edit-img-url" class="admin-input" style="margin-top:8px;font-size:12px" placeholder="أو الصق رابط الصورة هنا..." value="'+(p.image||'')+'" oninput="previewImageUrl('edit')"></div>'+

  '<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px">📌 اسم المنتج</label>'+
  '<input type="text" id="edit-name" class="admin-input" value="'+(p.name||'')+'" placeholder="اسم المنتج بالعربي"></div>'+

  '<div><label style="display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px">🔤 الاسم بالإنجليزي</label>'+

function closeEdit(){
  document.getElementById('edit-panel').style.display='none';
  document.body.style.overflow='';
  editingId=null;
}

function closeEditIfBackdrop(e){
  if(e.target===document.getElementById('edit-panel'))closeEdit();
}

function refreshEditSpecs(){
  var c=document.getElementById('edit-specs-tags');
  if(!c)return;
  if(!window._editSpecs||window._editSpecs.length===0){
    c.innerHTML='<span style="color:#334155;font-size:12px">لا توجد مواصفات بعد...</span>';
    return;
  }
  c.innerHTML=window._editSpecs.map(function(s,i){
    return '<div class="spec-tag"><span style="flex:1;font-size:12px">'+s+'</span><button type="button" onclick="removeEditSpec('+i+')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:11px"><i class="fas fa-times"></i></button></div>';
  }).join('');
}

function addEditSpec(){
  var inp=document.getElementById('edit-new-spec');
  var val=(inp?inp.value:'').trim();
  if(!val)return;
  window._editSpecs.push(val);
  inp.value='';
  refreshEditSpecs();
}

function removeEditSpec(i){
  window._editSpecs.splice(i,1);
  refreshEditSpecs();
}

function updateDiscountPreview(){
  var price=parseFloat((document.getElementById('edit-price')||{value:0}).value)||0;
  var old=parseFloat((document.getElementById('edit-oldPrice')||{value:0}).value)||0;
  var preview=document.getElementById('discount-preview');
  var pct=document.getElementById('discount-pct');
  if(old>price&&old>0&&price>0&&preview&&pct){
    pct.textContent=Math.round((1-price/old)*100)+'%';
    preview.style.display='block';
  }else if(preview)preview.style.display='none';
}

function changeStock(d){
  var inp=document.getElementById('edit-stock');
  if(!inp)return;
  inp.value=Math.max(0,(parseInt(inp.value)||0)+d);
  updateStockColor();
}

function setStock(v){
  var inp=document.getElementById('edit-stock');
  if(!inp)return;
  inp.value=v;
  updateStockColor();
}

function updateStockColor(){
  var inp=document.getElementById('edit-stock');
  if(!inp)return;
  var v=parseInt(inp.value)||0;
  inp.style.color=v===0?'#f87171':v<=3?'#fbbf24':'#34d399';
}

function triggerImageUpload(field){
  currentImgField=field;
  document.getElementById('img-file-input').click();
}

function handleImageUpload(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){applyImageToField(currentImgField,e.target.result);};
  reader.readAsDataURL(file);
  event.target.value='';
}

function handleImageDrop(event,field){
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  var file=event.dataTransfer&&event.dataTransfer.files[0];
  if(!file||!file.type.startsWith('image/'))return;
  currentImgField=field;
  var reader=new FileReader();
  reader.onload=function(e){applyImageToField(field,e.target.result);};
  reader.readAsDataURL(file);
}

function applyImageToField(field,src){
  var zone=document.getElementById(field+'-img-zone');
  var urlInp=document.getElementById(field+'-img-url');
  if(zone)zone.innerHTML='<img src="'+src+'" style="width:100%;height:140px;object-fit:cover">';
  if(urlInp)urlInp.value=src;
}

function previewImageUrl(field){
  var urlInp=document.getElementById(field+'-img-url');
  var zone=document.getElementById(field+'-img-zone');
  if(!urlInp||!zone)return;
  var url=urlInp.value.trim();
  if(url)zone.innerHTML='<img src="'+url+'" style="width:100%;height:140px;object-fit:cover" onerror="this.parentElement.innerHTML='<div style=\"color:#ef4444;font-size:12px;text-align:center\">رابط غير صحيح</div>'">';
}

function saveEdit(){
  var idx=adminProducts.findIndex(function(p){return p.id===editingId;});
  if(idx===-1){showToast('خطأ!');return;}
  var cat=document.getElementById('edit-category').value||'accessories';
  adminProducts[idx]=Object.assign({},adminProducts[idx],{
    name:(document.getElementById('edit-name').value||'').trim(),
    nameEn:(document.getElementById('edit-nameEn').value||'').trim(),
    category:cat,
    categoryName:(CAT_META[cat]||{label:cat}).label,
    badge:(document.getElementById('edit-badge').value||'').trim(),
    price:parseFloat(document.getElementById('edit-price').value)||0,
    oldPrice:(function(){var op=parseFloat(document.getElementById('edit-oldPrice').value)||0;var pr=parseFloat(document.getElementById('edit-price').value)||0;return op>pr?op:0;})(),
    stock:parseInt(document.getElementById('edit-stock').value)||0,
    rating:parseFloat(document.getElementById('edit-rating').value)||4.5,
    reviewsCount:parseInt(document.getElementById('edit-reviews').value)||0,
    shortDesc:(document.getElementById('edit-shortDesc').value||'').trim(),
    specs:[...(window._editSpecs||[])],
    image:(document.getElementById('edit-img-url').value||'').trim()||adminProducts[idx].image||''
  });
  saveProducts();
  closeEdit();
  renderAdminProducts();
  showToast('✅ تم حفظ "'+adminProducts[idx].name+'" بنجاح!');
}

function deleteProduct(id,fromEdit){
  var p=adminProducts.find(function(x){return x.id===id;});
  if(!p)return;
  if(!confirm('هل أنت متأكد من حذف "'+p.name+'"؟'))return;
  adminProducts=adminProducts.filter(function(x){return x.id!==id;});
  saveProducts();
  if(fromEdit)closeEdit();
  renderAdminProducts();
  showToast('🗑️ تم حذف "'+p.name+'"');
}

function duplicateProduct(id){
  var p=adminProducts.find(function(x){return x.id===id;});
  if(!p)return;
  var newId='COPY-'+Date.now().toString(36).toUpperCase();
  var copy=Object.assign({},p,{id:newId,name:'نسخة - '+p.name});
  var idx=adminProducts.findIndex(function(x){return x.id===id;});
  adminProducts.splice(idx+1,0,copy);
  saveProducts();
  renderAdminProducts();
  showToast('📋 تم نسخ "'+p.name+'"');
}

function submitAddProduct(){
  var name=(document.getElementById('add-name').value||'').trim();
  if(!name){showToast('❌ أدخل اسم المنتج!');return;}
  var price=parseFloat(document.getElementById('add-price').value)||0;
  if(!price){showToast('❌ أدخل السعر!');return;}
  var cat=document.getElementById('add-category').value||'accessories';
  var oldPrice=parseFloat(document.getElementById('add-oldPrice').value)||0;
  var np={
    id:'NEW-'+Date.now().toString(36).toUpperCase(),
    name:name,
    nameEn:(document.getElementById('add-nameEn').value||'').trim(),
    category:cat,
    categoryName:(CAT_META[cat]||{label:cat}).label,
    badge:(document.getElementById('add-badge').value||'').trim(),
    price:price,
    oldPrice:oldPrice>price?oldPrice:0,
    stock:parseInt(document.getElementById('add-stock').value)||0,
    rating:parseFloat(document.getElementById('add-rating').value)||4.5,
    reviewsCount:parseInt(document.getElementById('add-reviews').value)||0,
    shortDesc:(document.getElementById('add-shortDesc').value||'').trim(),
    specs:[...addFormSpecs],
    image:(document.getElementById('add-img-url').value||'').trim(),
    displayIndex:adminProducts.length+1
  };
  adminProducts.push(np);
  saveProducts();
  showSection('products');
  renderAdminProducts();
  showToast('✅ تم إضافة "'+name+'"!');
}

    {l:'إجمالي المخزون',v:total,i:'fas fa-warehouse',c:'#34d399',bg:'rgba(52,211,153,0.1)'},
    {l:'نفد المخزون',v:zero.length,i:'fas fa-triangle-exclamation',c:'#f87171',bg:'rgba(248,113,113,0.1)'},
    {l:'أجهزة اللاسلكي',v:cc.devices||0,i:'fas fa-radio',c:'#60a5fa',bg:'rgba(96,165,250,0.1)'},
    {l:'أجهزة الثريا',v:cc.thuraya||0,i:'fas fa-satellite',c:'#38bdf8',bg:'rgba(56,189,248,0.1)'},
    {l:'قارمن وملاحة',v:cc.garmin||0,i:'fas fa-map-location-dot',c:'#4ade80',bg:'rgba(74,222,128,0.1)'},
    {l:'ملحقات وهوائيات',v:cc.accessories||0,i:'fas fa-plug',c:'#fbbf24',bg:'rgba(251,191,36,0.1)'},
    {l:'شرائح وخدمات',v:(cc.cards||0)+(cc.services||0),i:'fas fa-sim-card',c:'#c084fc',bg:'rgba(192,132,252,0.1)'}
  ];
  sg.innerHTML=stats.map(function(s){
    return '<div class="stat-card" style="display:flex;align-items:center;gap:16px">'+
    '<div style="width:48px;height:48px;border-radius:12px;background:'+s.bg+';color:'+s.c+';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0"><i class="'+s.i+'"></i></div>'+
    '<div><div style="font-size:26px;font-weight:900;font-family:monospace;color:'+s.c+'">'+s.v+'</div>'+
    '<div style="font-size:12px;color:#64748b">'+s.l+'</div></div></div>';
  }).join('');
  if(zl){
    if(zero.length===0){
      zl.innerHTML='<div style="color:#34d399;font-size:13px;text-align:center;padding:20px"><i class="fas fa-check-circle"></i> كل المنتجات لديها مخزون ✓</div>';
    }else{
      zl.innerHTML=zero.map(function(p){
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.2);border-radius:10px;margin-bottom:8px">'+
        '<div><div style="color:#fff;font-size:13px;font-weight:700">'+p.name+'</div>'+
        '<div style="color:#475569;font-size:11px;font-family:monospace">'+p.id+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
        '<span style="color:#ef4444;font-size:12px;font-weight:700">مخزون: '+(p.stock||0)+'</span>'+
        '<button onclick="openEdit(''+p.id+'');showSection('products')" style="font-size:11px;background:rgba(34,211,238,0.1);color:#22d3ee;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif">تعديل</button>'+
        '</div></div>';
      }).join('');
    }
  }
}

function exportData(){
  var d=JSON.stringify(adminProducts,null,2);
  var b=new Blob([d],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u;a.download='barq-products-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(u);
  showToast('📥 تم تصدير البيانات!');
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(function(){t.style.display='none';},3000);
}
</script>
</body>
